[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kol-signal"
version = "0.5.0a1"
description = "Local-first KOL list auditor for Creator Signal Intelligence Open Alpha."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["creator-marketing", "kol", "data-quality", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
benchmark-deepseek = [
  "openai>=1.0,<3",
]

[project.scripts]
kol-signal = "kol_signal.cli:main"

[tool.setuptools.packages.find]
include = ["kol_signal*"]

[tool.setuptools.package-data]
"kol_signal.demo_data" = ["*.csv", "*.txt"]
